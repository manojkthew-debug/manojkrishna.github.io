<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manoj Krishna — Web Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --black: #0A0A0A;
  --white: #F5F5F0;
  --red: #D63A5A;
  --gray: rgba(255,255,255,0.35);
  --border: rgba(255,255,255,0.08);
}
html { scroll-behavior: smooth; }
body { background: var(--black); color: var(--white); font-family: 'Outfit', sans-serif; overflow-x: hidden; cursor: none; }

/* CURSOR */
.cursor { width: 10px; height: 10px; background: var(--white); border-radius: 50%; position: fixed; pointer-events: none; z-index: 99999; transform: translate(-50%,-50%); transition: transform .1s, width .3s, height .3s, background .3s; }
.cursor-follower { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; position: fixed; pointer-events: none; z-index: 99998; transform: translate(-50%,-50%); transition: transform .15s ease, width .4s, height .4s, border-color .3s; }
.cursor.hover { width: 6px; height: 6px; background: var(--red); }
.cursor-follower.hover { width: 56px; height: 56px; border-color: var(--red); }

/* NAV */
nav {
  position: fixed; top: 0; width: 100%; z-index: 1000;
  padding: 32px 48px;
  display: flex; justify-content: space-between; align-items: center;
  mix-blend-mode: difference;
}
.nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; text-decoration: none; color: var(--white); }
.nav-links { display: flex; gap: 36px; }
.nav-links a { text-decoration: none; color: var(--white); font-size: .78rem; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; opacity: .6; transition: opacity .3s; }
.nav-links a:hover { opacity: 1; }

/* HERO */
.hero {
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hero-photo {
  position: absolute;
  inset: 0;
  z-index: 0;
}
/* Portrait placeholder - grayscale gradient silhouette */
.hero-portrait { width: 100%; height: 100%; position: absolute; }
.hero-portrait-svg {
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 420px; height: 75vh;
  opacity: 0.15;
}
.hero-overlay { display: none; }
.hero-content {
  position: relative;
  z-index: 3;
  text-align: center;
}
.hero-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3rem, 10vw, 8rem);
  font-weight: 300;
  letter-spacing: -3px;
  line-height: 1;
  margin-bottom: 20px;
  color: var(--white);
}
.hero-name .line { display: block; overflow: hidden; }
.hero-name .line span { display: block; transform: translateY(100%); animation: slideUp 1.2s cubic-bezier(.16,1,.3,1) forwards; opacity: 0; }
.hero-name .line:nth-child(1) span { animation-delay: .2s; }
.hero-name .line:nth-child(2) span { animation-delay: .38s; }
@keyframes slideUp { to { transform: translateY(0); opacity: 1; } }
.hero-sub {
  font-size: .9rem;
  font-weight: 300;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  opacity: 0;
  animation: fadeIn 1s ease 1s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

/* SCROLL INDICATOR */
.scroll-indicator { z-index: 3;
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  opacity: 0; animation: fadeIn 1s ease 1.5s forwards;
  z-index: 2;
}
.scroll-mouse-icon {
  width: 22px; height: 36px;
  border: 1.5px solid rgba(255,255,255,.35);
  border-radius: 11px;
  position: relative;
}
.scroll-mouse-icon::after {
  content: '';
  width: 3px; height: 7px;
  background: var(--white);
  border-radius: 3px;
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  animation: scrollBounce 2s ease-in-out infinite;
}
@keyframes scrollBounce { 0%,100%{transform:translateX(-50%) translateY(0);opacity:1} 80%{transform:translateX(-50%) translateY(12px);opacity:0} }
.scroll-indicator span { font-size: .6rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gray); }

/* GRID LINES (vertical) */
.grid-lines {
  position: absolute; inset: 0; z-index: 1;
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
  pointer-events: none;
}
.grid-line { border-left: 1px solid var(--border); height: 100%; }
.grid-line:last-child { border-right: 1px solid var(--border); }

/* SECTIONS */
section { padding: 120px 48px; position: relative; }
section .grid-lines { position: absolute; }
.section-label {
  font-size: .72rem; letter-spacing: 4px; text-transform: uppercase;
  color: var(--gray); margin-bottom: 60px;
  display: flex; align-items: center; gap: 16px;
}
.section-label::before { content: ''; width: 40px; height: 1px; background: var(--gray); }

/* PORTFOLIO */
.portfolio { padding-top: 80px; }
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: 1px solid var(--border);
  border-left: 1px solid var(--border);
}
.p-card {
  position: relative;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  aspect-ratio: 4/3.2;
  cursor: none;
}
.p-card-inner {
  position: absolute; inset: 0;
  display: flex;
}
/* Left: image side */
.p-card-img {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 4rem;
  transition: transform .8s cubic-bezier(.25,.46,.45,.94);
  background: #111;
}
.p-card:hover .p-card-img { transform: scale(1.04); }
/* Red reveal block */
.p-card-block {
  position: absolute; top: 0; right: 0;
  width: 42%; height: 100%;
  background: var(--red);
  transform: translateY(100%);
  transition: transform .7s cubic-bezier(.16,1,.3,1);
  z-index: 2;
}
.p-card.in-view .p-card-block { transform: translateY(0); }
.p-card.revealed .p-card-block { transform: translateY(-100%); }
/* Hover overlay */
.p-card-overlay {
  position: absolute; inset: 0; z-index: 3;
  background: rgba(0,0,0,.7);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 32px;
  opacity: 0;
  transition: opacity .4s;
}
.p-card:hover .p-card-overlay { opacity: 1; }
.p-card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem; font-weight: 400;
  transform: translateY(12px);
  transition: transform .4s;
}
.p-card:hover .p-card-title { transform: translateY(0); }
.p-card-cat {
  font-size: .7rem; letter-spacing: 2px; text-transform: uppercase;
  color: var(--gray); margin-top: 6px;
  transform: translateY(8px); transition: transform .4s .05s;
}
.p-card:hover .p-card-cat { transform: translateY(0); }
.p-card-arrow {
  position: absolute; top: 24px; right: 24px;
  width: 36px; height: 36px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem;
  opacity: 0; transform: scale(.8);
  transition: all .4s;
}
.p-card:hover .p-card-arrow { opacity: 1; transform: scale(1); }

/* Card colors */
.p-card:nth-child(1) .p-card-img { background: linear-gradient(135deg, #111 60%, #1a1a1a); }
.p-card:nth-child(2) .p-card-img { background: linear-gradient(135deg, #0f0f0f 60%, #1c1c1c); }
.p-card:nth-child(3) .p-card-img { background: linear-gradient(135deg, #131313 60%, #1e1e1e); }
.p-card:nth-child(4) .p-card-img { background: linear-gradient(135deg, #0d0d0d 60%, #191919); }
.p-card:nth-child(5) .p-card-img { background: linear-gradient(135deg, #111 60%, #1b1b1b); }
.p-card:nth-child(6) .p-card-img { background: linear-gradient(135deg, #0f0f0f 60%, #1d1d1d); }

/* ABOUT */
.about-section {
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start;
}
.about-left { position: sticky; top: 120px; }
.about-label { font-size: .72rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gray); margin-bottom: 48px; }
.about-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.5rem, 4vw, 4rem);
  font-weight: 300; line-height: 1.1; letter-spacing: -1px;
  margin-bottom: 32px;
}
.about-name em { font-style: italic; color: var(--red); }
.about-desc { color: var(--gray); line-height: 2; font-size: .95rem; max-width: 440px; margin-bottom: 40px; }
.about-cta {
  display: inline-flex; align-items: center; gap: 16px;
  font-size: .78rem; letter-spacing: 2px; text-transform: uppercase;
  text-decoration: none; color: var(--white); padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.2);
  transition: border-color .3s, gap .3s;
}
.about-cta:hover { border-color: var(--white); gap: 24px; }
.about-right { padding-top: 16px; }
.skills-row {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 48px;
}
.skill-tag {
  padding: 10px 22px;
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: .78rem;
  letter-spacing: 1px;
  color: var(--gray);
  transition: all .3s;
}
.skill-tag:hover { border-color: rgba(255,255,255,.3); color: var(--white); background: rgba(255,255,255,.03); }
.exp-list { list-style: none; border-top: 1px solid var(--border); }
.exp-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
  transition: padding .3s;
}
.exp-item:hover { padding-left: 12px; }
.exp-item h4 { font-weight: 400; font-size: .95rem; }
.exp-item span { font-size: .75rem; color: var(--gray); letter-spacing: 1px; }

/* CONTACT */
.contact-section {
  border-top: 1px solid var(--border);
  text-align: center; padding: 140px 48px;
}
.contact-big {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3rem, 7vw, 7rem);
  font-weight: 300; letter-spacing: -3px; line-height: .95;
  margin-bottom: 48px;
}
.contact-big em { font-style: italic; color: var(--red); }
.contact-email {
  font-size: .82rem; letter-spacing: 3px; text-transform: uppercase;
  color: var(--gray); text-decoration: none;
  display: inline-flex; align-items: center; gap: 16px;
  border-bottom: 1px solid var(--border); padding-bottom: 8px;
  transition: color .3s, border-color .3s, gap .3s;
}
.contact-email:hover { color: var(--white); border-color: rgba(255,255,255,.4); gap: 24px; }
.contact-links { display: flex; gap: 32px; justify-content: center; margin-top: 60px; }
.contact-link {
  font-size: .72rem; letter-spacing: 3px; text-transform: uppercase;
  text-decoration: none; color: var(--gray);
  transition: color .3s;
}
.contact-link:hover { color: var(--white); }

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  padding: 32px 48px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: .72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray);
}
footer a { color: var(--gray); text-decoration: none; transition: color .3s; }
footer a:hover { color: var(--white); }

/* MARQUEE */
.marquee-bar {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow: hidden; padding: 20px 0;
}
.marquee-inner { display: flex; gap: 64px; animation: marq 25s linear infinite; width: max-content; }
.marquee-inner span {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-weight: 300; white-space: nowrap;
  display: flex; align-items: center; gap: 20px; color: var(--gray);
}
.marquee-inner span em { font-style: normal; color: var(--red); font-size: .5rem; }
@keyframes marq { to { transform: translateX(-50%); } }

/* SCROLL ANIMATION BASE */
.reveal-up { opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(.16,1,.3,1); }
.reveal-up.visible { opacity: 1; transform: translateY(0); }
.delay-1 { transition-delay: .1s; }
.delay-2 { transition-delay: .2s; }
.delay-3 { transition-delay: .3s; }
.delay-4 { transition-delay: .4s; }
.delay-5 { transition-delay: .5s; }

/* NUMBER COUNTER FOR CONTACT */
.contact-stats {
  display: flex; gap: 80px; justify-content: center;
  margin: 64px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 48px 0;
}
.c-stat strong {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.5rem; font-weight: 300; display: block; line-height: 1;
  background: linear-gradient(135deg, #D63A5A, #FF6B6B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.c-stat span { font-size: .7rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gray); }

/* RESPONSIVE */
@media(max-width:900px){
  nav{padding:24px 24px}
  section{padding:80px 24px}
  .portfolio-grid{grid-template-columns:1fr 1fr}
  .about-section{grid-template-columns:1fr;gap:48px}
  .about-left{position:relative;top:auto}
  .contact-stats{flex-wrap:wrap;gap:40px}
  .contact-big{letter-spacing:-1px}
}
@media(max-width:600px){
  .portfolio-grid{grid-template-columns:1fr}
  .cursor,.cursor-follower{display:none}
  body{cursor:auto}
  .nav-links{display:none}
  .contact-big{font-size:3rem}
}

/* HERO PHOTO - BULLETPROOF REVEAL */
.hero-photo {
  position: absolute; inset: 0; overflow: hidden;
}
.hero-photo img {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: auto;
  height: 100%;
  max-width: 55%;
  object-fit: cover;
  object-position: center top;
  filter: grayscale(1) contrast(1.1) brightness(0.9);
  display: block;
}
/* Mobile: full width, show full face */
@media (max-width: 768px) {
  .hero-photo img {
    left: 0;
    transform: none;
    width: 100%;
    max-width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 5%;
  }
}
@keyframes photoZoom {
  to { transform: scale(1); }
}

/* Red wipe block - slides down from top, pauses, then slides down to exit */
.hero-red-wipe {
  position: absolute;
  inset: 0;
  z-index: 8;
  background: #D63A5A;
  z-index: 5;
  transform: translateY(-100%);
  animation: redWipe 1.6s cubic-bezier(.77,0,.18,1) 0.3s forwards;
}
@keyframes redWipe {
  0%   { transform: translateY(-100%); }
  40%  { transform: translateY(0%); }
  60%  { transform: translateY(0%); }
  100% { transform: translateY(100%); }
}


@media (max-width: 768px) {
  .hero-content {
    position: absolute;
    bottom: 22%;
    left: 0; right: 0;
    text-align: center;
    padding: 0 20px;
  }
  .hero-name {
    font-size: clamp(3rem, 14vw, 5rem);
    letter-spacing: -1px;
  }
  .scroll-indicator {
    bottom: 6%;
  }
  .hero {
    justify-content: center;
  }
  nav {
    padding: 20px 20px;
  }
}

</style>
</head>

<div class="cursor-follower" id="follower"></div>

  <a href="#" class="nav-logo">MK</a>
  <div class="nav-links">
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->

  <div class="grid-lines"><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div></div>
